<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>news letter</title>
</head>
<body>
    <h1>newsletter</h1>
    <form>
        <label for="name"> enter your full name:</label><br>
        <input type="text" id="name" name="name" required placeholder="Enter your full name"><br>
        <label for="email"> enter your email:</label><br>
        <input type="email" id="email" name="email" required placeholder="Enter your email"><br>
        <input type="checkbox" id="conditions" name="conditions" value="agree" required>
        <label for="conditions"> I agree to the terms and conditions</label><br>
        <input type="submit" value="Submit">
    </form>
