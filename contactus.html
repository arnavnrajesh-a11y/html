<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" maxlength="5" required placeholder="Enter your name" size="30"><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required placeholder="Enter your email" size="30"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required placeholder="Enter your phone number" size="30"><br><br>
        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" required placeholder="Enter the subject of your message" size="30"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" required placeholder="Enter your message" size="30"></textarea><br><br>

        <input type="submit" value="Submit"><br><br>
        &copy; 2026 Contact Us. All rights reserved.
    </form>
</body>
</html>
