<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>information form</title>
</head>
<body>
    <h1>personal information</h1>
    <form>
        <label for="name"> name:</label><br>
        <input type="text" id="name" name="name" required placeholder="Enter your name"><br>
        <label for="email"> email:</label><br>
        <input type="email" id="email" name="email" required placeholder="Enter your email"><br>
        <label for="password"> password:</label><br>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br>
        <label for="address"> address:</label><br>
        <textarea id="address" name="address" required placeholder="Enter your address"></textarea><br>
        <label for="number"> number:</label><br>
        <input type="number" id="number" name="number" required placeholder="Enter your number"><br>
        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
