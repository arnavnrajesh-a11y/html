<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>personal information</h1>
    <form>
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname" required size="50"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname"  placeholder="Enter your last name"><br>
        <input type="radio" value="male" name="gender"> Male<br>
        <input type="radio" value="female" name="gender"> Female<br>
        <label for="hobby">Choose Hobbies:</label><br>
        <select id="hobby" name="hobby">
            <option value="reading">Reading</option>
            <option value="traveling">Traveling</option>
            <option value="sports">Sports</option>
            <option value="music">Music</option>
            <option value="coding">coding</option>

        </select><br>
        <label for="color">Choose your favorite color:</label><br>
        
        <input type="submit" value="Submit">    
       
    </form>
</body>
</html>
